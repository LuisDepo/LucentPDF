# Definición del proyecto Xcode para XcodeGen.
# Generar el .xcodeproj con:  xcodegen generate
# (lo hace automáticamente GitHub Actions; en local: scripts/dev_setup.sh)

name: LucentPDF

options:
  bundleIdPrefix: com.lucentpdf
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""              # PLACEHOLDER: rellenar para firmar/notarizar (ver docs/DISTRIBUCION.md)
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"           # firma ad-hoc (build de coste cero, sin notarizar)
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.2"

targets:
  LucentPDF:
    type: application
    platform: macOS
    sources:
      - path: LucentPDF
        excludes:
          - "Resources/Info.plist"
          - "Resources/LucentPDF.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucentpdf.app
        PRODUCT_NAME: LucentPDF
        INFOPLIST_FILE: LucentPDF/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LucentPDF/Resources/LucentPDF.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - package: Sparkle

  LucentPDFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LucentPDFTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucentpdf.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LucentPDF

schemes:
  LucentPDF:
    build:
      targets:
        LucentPDF: all
        LucentPDFTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LucentPDFTests
    archive:
      config: Release
